<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Links</title>
<link rel="stylesheet" href="theme.css">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--navy-deep); color: var(--parchment); font: 14px/1.45 var(--body);
    display: grid; grid-template-rows: auto auto 1fr; overflow: hidden;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* header: title, the ten acts, saved */
  header { display: flex; align-items: center; gap: 16px; padding: 14px 22px; border-bottom: 1px solid var(--brass-dim); }
  header h1 { font: 400 22px/1 var(--display); font-variant: small-caps; letter-spacing: .04em; margin: 0; color: var(--brass); }
  .acts { display: flex; gap: 4px; flex: 1; }
  .acts button {
    position: relative; min-width: 38px; height: 30px; padding: 0 8px; cursor: pointer; font-variant-numeric: tabular-nums;
    background: none; border: 1px solid var(--brass-dim); border-radius: 3px; color: var(--muted);
  }
  .acts button:hover { border-color: var(--brass); color: var(--parchment); }
  .acts button[aria-pressed="true"] { background: var(--brass); border-color: var(--brass); color: var(--navy-deep); font-weight: 600; }
  /* an act that already has links */
  .acts button.has::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--brass); }
  .acts button[aria-pressed="true"].has::after { background: var(--navy-deep); }
  #saved { color: var(--muted); font-size: 12px; min-width: 50px; text-align: right; }

  /* the act being edited, and its tools */
  .toolbar { display: flex; align-items: center; gap: 10px; padding: 14px 22px 12px; position: relative; }
  .toolbar h2 { font: 400 26px/1.1 var(--display); font-variant: small-caps; letter-spacing: .03em; margin: 0; flex: 1; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; cursor: pointer;
    background: none; border: 1px solid var(--brass-dim); border-radius: 3px; color: var(--parchment);
  }
  .btn:hover { border-color: var(--brass); background: var(--navy-raised); }
  .btn.primary { border-color: var(--brass); color: var(--brass); }
  .btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .btn.yes { background: #a23c2b; border-color: var(--bad); color: #fff; }
  .ask { display: flex; align-items: center; gap: 8px; font-size: 13px; }

  /* "add gem" search, under its button */
  .add-panel {
    position: absolute; right: 22px; top: calc(100% - 4px); z-index: 5; width: 420px;
    background: var(--navy-raised); border: 1px solid var(--brass); border-radius: 4px; padding: 10px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
  }
  .field { width: 100%; background: var(--navy-deep); border: 1px solid var(--brass-dim); border-radius: 3px; padding: 8px 10px; }
  .field:focus { border-color: var(--brass); outline: none; }
  .add-list { list-style: none; margin: 8px 0 0; padding: 0; max-height: 320px; overflow-y: auto; }
  .add-list li { display: grid; grid-template-columns: 12px 1fr auto; gap: 9px; align-items: center; padding: 6px 8px; border-radius: 3px; cursor: pointer; }
  .add-list li[aria-selected="true"], .add-list li:hover { background: rgba(176, 141, 79, .22); }
  .add-list small { color: var(--muted); }
  .add-hint { color: var(--muted); font-size: 12px; margin-top: 8px; }

  /* two columns: active gems with their links, supports */
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 0; min-height: 0; border-top: 1px solid var(--brass-dim); }
  .col { display: flex; flex-direction: column; min-height: 0; }
  .col + .col { border-left: 1px solid var(--brass-dim); }
  .col-head { padding: 12px 22px 8px; }
  .col-head h3 { margin: 0; font: 400 17px/1.2 var(--display); font-variant: small-caps; letter-spacing: .03em; }
  .col-head p { margin: 2px 0 0; color: var(--muted); font-size: 12px; min-height: 18px; }
  .col-list { flex: 1; overflow-y: auto; padding: 0 22px 20px; list-style: none; margin: 0; }
  .empty { color: var(--muted); padding: 10px 0; }

  .socket { width: 11px; height: 11px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .55); flex: none; }
  .socket.str { background: var(--str); } .socket.dex { background: var(--dex); }
  .socket.int { background: var(--int); } .socket.white { background: var(--white); }
  .socket.unknown { background: none; border-color: var(--muted); }
  .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--brass-dim); border-radius: 8px; padding: 0 6px; white-space: nowrap; }
  .x { background: none; border: 0; padding: 0 4px; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; }
  .x:hover { color: var(--str); }

  /* an active gem: a card that shows its link like sockets on an item */
  .card {
    margin: 0 0 8px; padding: 9px 10px 9px 12px; cursor: pointer;
    background: var(--navy); border: 1px solid rgba(93, 76, 46, .7); border-radius: 4px;
  }
  .card:hover { border-color: var(--brass-dim); background: #141a35; }
  .card[aria-selected="true"] { border-color: var(--brass); box-shadow: inset 3px 0 0 var(--brass); background: var(--navy-raised); }
  .card-head { display: flex; align-items: center; gap: 9px; }
  .card-head .name { flex: 1; font: 400 17px/1.25 var(--display); }
  .card-head .count { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .chain { margin: 6px 0 0 0; padding: 0; list-style: none; }
  .chain li { position: relative; display: flex; align-items: center; gap: 9px; padding: 2px 0 2px 0; font-size: 13px; }
  .chain li .nm { flex: 1; }
  /* the bar between two sockets, like the links of an item */
  .chain li::before { content: ""; position: absolute; left: 4px; top: -7px; width: 3px; height: 9px; background: #8f7d58; border-radius: 1px; }
  .card-head .socket { position: relative; z-index: 1; }
  .card .no-supports { color: var(--muted); font-size: 12px; margin-top: 4px; }
  /* the box that links another active gem to the one selected */
  .link-box {
    width: 22px; height: 22px; padding: 0; display: grid; place-items: center; flex: none; cursor: pointer;
    background: none; border: 1px solid var(--brass-dim); border-radius: 3px; color: var(--navy-deep); font-size: 13px; font-weight: 700;
  }
  .link-box:hover { border-color: var(--brass); }
  .link-box[aria-checked="true"] { background: var(--brass); border-color: var(--brass); }
  .link-box[aria-checked="true"]::after { content: "✓"; }
  .card .used { color: var(--muted); font-size: 12px; white-space: nowrap; }

  /* Hold (Set 2) and Drop: two small toggles on every gem */
  .marks { display: inline-flex; gap: 2px; flex: none; }
  .mark-btn { width: 24px; height: 24px; padding: 0; display: grid; place-items: center; background: none; border: 1px solid transparent; border-radius: 3px; color: #6f6a5c; cursor: pointer; }
  .mark-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .mark-btn:hover { color: var(--parchment); border-color: var(--brass-dim); }
  .mark-btn.hold[aria-pressed="true"] { color: var(--navy-deep); background: #6cb4f0; border-color: #6cb4f0; }
  .mark-btn.drop[aria-pressed="true"] { color: #fff; background: #a23c2b; border-color: var(--bad); }
  .tag.hold { color: #9fd0f7; border-color: #3f6e96; }
  .tag.drop { color: #f0b3a6; border-color: #7a3a30; }
  .mark-btn.swap[aria-pressed="true"] { color: var(--navy-deep); background: #e0b04a; border-color: #e0b04a; }
  .tag.swap { color: #f2d48a; border-color: #7a6232; white-space: nowrap; }
  .card.swapped .name { color: var(--muted); }

  /* "swap for...": the gems to pick from, next to the button that opened it */
  .swap-panel {
    position: fixed; z-index: 6; width: 340px; padding: 10px;
    background: var(--navy-raised); border: 1px solid #e0b04a; border-radius: 4px; box-shadow: 0 10px 30px rgba(0, 0, 0, .55);
  }
  .swap-title { font-size: 13px; margin-bottom: 8px; }
  .swap-title b { font-weight: 600; color: #f2d48a; }
  .swap-list { list-style: none; margin: 8px 0 0; padding: 0; max-height: 260px; overflow-y: auto; }
  .swap-list li { display: grid; grid-template-columns: 12px 1fr auto; gap: 9px; align-items: center; padding: 5px 8px; border-radius: 3px; cursor: pointer; }
  .swap-list li[aria-selected="true"], .swap-list li:hover { background: rgba(224, 176, 74, .2); }
  .swap-list small { color: var(--muted); }
  .swap-list .sep { display: block; padding: 6px 8px 2px; color: var(--muted); font-size: 11px; cursor: default; }
  .swap-list .sep:hover { background: none; }
  /* a marked gem is out of this act's links: faded, and it cannot be linked */
  .card.marked { cursor: default; background: none; }
  .card.marked:hover { background: none; border-color: rgba(93, 76, 46, .7); }
  .card.marked .name { color: var(--muted); }
  .card.dropped .name { text-decoration: line-through; text-decoration-color: rgba(224, 112, 90, .7); }
  .sup.marked { cursor: default; }
  .sup.marked:hover { background: none; }
  .sup.marked .nm { color: var(--muted); }
  .sup.dropped .nm > :first-child, .sup.dropped .nm { text-decoration-color: rgba(224, 112, 90, .7); }
  .sup.marked .mark { visibility: hidden; }

  /* a support: click to put it in the selected gem's link, or take it out */
  .sup {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 10px; border-bottom: 1px solid rgba(93, 76, 46, .35); cursor: pointer;
  }
  .sup .nm { flex: 1; min-width: 0; }
  .sup:hover { background: var(--navy-raised); }
  .sup .mark { width: 16px; height: 16px; border: 1px solid var(--brass-dim); border-radius: 3px; display: grid; place-items: center; color: var(--navy-deep); font-size: 12px; font-weight: 700; }
  .sup[aria-checked="true"] { background: rgba(176, 141, 79, .12); }
  .sup[aria-checked="true"] .mark { background: var(--brass); border-color: var(--brass); }
  .sup[aria-checked="true"] .mark::after { content: "✓"; }
  .sup .used { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .sups.idle .sup { cursor: default; }
  .sups.idle .sup .mark { opacity: .35; }
</style>
</head>
<body>
<header>
  <h1>Links</h1>
  <div class="acts" id="acts" role="group" aria-label="Act"></div>
  <span id="saved" aria-live="polite"></span>
</header>

<div class="toolbar">
  <h2 id="act-title"></h2>
  <span class="ask" id="copy-ask" hidden>
    <span id="copy-ask-text"></span>
    <button class="btn yes" id="copy-yes">Replace</button>
    <button class="btn" id="copy-no">Cancel</button>
  </span>
  <button class="btn primary" id="copy" hidden>
    <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.500" y="5.500" width="8" height="8" rx="1.500"/><path d="M10.500 3.500v-.500a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h.500"/></svg>
    <span id="copy-text"></span>
  </button>
  <button class="btn" id="add" aria-expanded="false" aria-controls="add-panel">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
    Add gem
  </button>
  <div class="add-panel" id="add-panel" hidden>
    <input class="field" id="add-input" placeholder="Search all gems" autocomplete="off" spellcheck="false" aria-label="Search all gems">
    <ul class="add-list" id="add-list"></ul>
    <div class="add-hint">Gems added here are only for the links of this act. You are not reminded to buy them.</div>
  </div>
</div>

<div class="swap-panel" id="swap-panel" role="dialog" aria-label="Swap for another gem" hidden>
  <div class="swap-title" id="swap-title"></div>
  <input class="field" id="swap-input" placeholder="Search a gem" autocomplete="off" spellcheck="false" aria-label="Search the gem to swap in">
  <ul class="swap-list" id="swap-list"></ul>
</div>

<main>
  <section class="col" aria-label="Active gems">
    <div class="col-head">
      <h3>Active gems</h3>
      <p id="skill-hint">Click one to choose its supports on the right.</p>
    </div>
    <ul class="col-list" id="skills"></ul>
  </section>
  <section class="col" aria-label="Supports">
    <div class="col-head">
      <h3>Supports</h3>
      <p id="sup-hint"></p>
    </div>
    <ul class="col-list sups" id="supports"></ul>
  </section>
</main>
<!-- marks: kept in the weapon swap, swapped for another gem, or thrown away -->
<template id="hold-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.500" y="3" width="11" height="3.500" rx=".800"/><path d="M3.500 6.500v6.500h9V6.500M6.500 9h3"/></svg></template>
<template id="swap-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 5.500h9.500M10 3l2.500 2.500L10 8M13 10.500H3.500M6 8l-2.500 2.500L6 13"/></svg></template>
<template id="drop-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.500 4.500h11M6 4.500V3h4v1.500M4 4.500l.700 9h6.600l.700-9M6.700 7v4.500M9.300 7v4.500"/></svg></template>
<script src="../core/links.js"></script>
<script src="js/search.js"></script>
<script src="js/links.js"></script>
</body>
</html>
