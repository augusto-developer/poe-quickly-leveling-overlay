<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'; media-src 'self' file:">
<title>Gems</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
  body { font: 13px/1.35 "Segoe UI", system-ui, sans-serif; color: #e9dfc8; }
  .panel {
    display: inline-block; min-width: 190px; max-width: 280px;
    background: rgba(14, 11, 8, 0.86); border: 1px solid #6b5a3a; border-radius: 4px;
    padding: 8px 10px;
  }
  .head { display: flex; align-items: baseline; gap: 8px; }
  .area { flex: 1; font-weight: 600; color: #d8b56a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .act { font-size: 11px; color: #9a8c70; white-space: nowrap; }
  .act[hidden] { display: none; }
  .act.switch { cursor: pointer; text-decoration: underline dotted; }
  .act.switch:hover { color: #fff; }
  /* row of small icon buttons above the area name */
  .bar { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; cursor: grab; touch-action: none; }
  .bar.dragging { cursor: grabbing; }
  .grip { display: inline-flex; align-items: center; color: #7d7058; margin-right: 1px; }
  .grip svg { width: 12px; height: 18px; fill: currentColor; }
  .bar .gap { flex: 1; }
  .ico {
    width: 24px; height: 24px; padding: 0; display: inline-grid; place-items: center; flex: none;
    background: none; border: 0; border-radius: 4px; color: #b3a586; cursor: pointer;
  }
  .ico:hover, .ico[aria-expanded="true"] { color: #fff; background: rgba(216, 181, 106, 0.2); }
  .ico[hidden] { display: none; }
  .ico:focus-visible, .item:focus-visible { outline: 1px solid #d8b56a; outline-offset: 0; }
  #quit:hover { background: rgba(192, 80, 60, 0.4); }
  /* the rarely used actions live in a menu under the bar, opened by the three dots */
  .menu { margin: -2px 0 8px; padding: 3px; border: 1px solid #5d4c2e; border-radius: 4px; background: rgba(10, 13, 28, 0.6); display: grid; gap: 1px; }
  .menu[hidden] { display: none; }
  .item {
    display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box; padding: 4px 6px; text-align: left;
    font: inherit; font-size: 12px; color: #d9cfb8; background: none; border: 0; border-radius: 3px; cursor: pointer;
  }
  .item svg { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  button.item:hover { background: rgba(216, 181, 106, 0.2); color: #fff; }
  .item.danger { color: #e8a090; }
  button.item.danger:hover { background: rgba(192, 80, 60, 0.35); color: #fff; }
  .item.size { cursor: default; padding: 1px 2px 1px 6px; }
  .item.size .ico + .ico { margin-left: -6px; }
  .item.size span { flex: 1; }
  /* volume: a thin brass track with a round handle */
  .item.volume { cursor: default; padding-right: 8px; }
  .item.volume .muted, .item.volume.off .waves { display: none; }
  .item.volume.off .muted { display: inline; }
  .item.volume input { flex: 1; min-width: 0; height: 16px; margin: 0; background: none; cursor: pointer; -webkit-appearance: none; appearance: none; }
  .item.volume input::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: linear-gradient(to right, #d8b56a var(--fill, 80%), #4a3f2a var(--fill, 80%)); }
  .item.volume input::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; margin-top: -4px; border-radius: 50%; background: #e9dfc8; border: 1px solid #5d4c2e; }
  .item.volume input:hover::-webkit-slider-thumb { background: #fff; }
  .item.volume output { width: 22px; text-align: right; font-size: 11px; color: #9a8c70; font-variant-numeric: tabular-nums; }
  .confirm { margin-bottom: 8px; padding: 8px 9px 9px; border: 1px solid #7a3a30; border-left: 3px solid #c0503c; border-radius: 3px; background: rgba(192, 80, 60, 0.1); }
  .confirm[hidden] { display: none; }
  .confirm strong { display: block; font-size: 13px; color: #f0b3a6; margin-bottom: 4px; }
  .confirm p { margin: 0 0 4px; font-size: 11px; line-height: 1.4; color: #d9cfb8; }
  .confirm .keep { color: #9a8c70; }
  .confirm .actions { display: flex; gap: 6px; margin-top: 8px; }
  .confirm button { flex: 1; font: inherit; font-size: 12px; padding: 4px 6px; border-radius: 3px; cursor: pointer; }
  .confirm .yes { background: #a23c2b; border: 1px solid #e0705a; color: #fff; }
  .confirm .yes:hover { background: #c0503c; }
  .confirm .no { background: none; border: 1px solid #5d4c2e; color: #d9cfb8; }
  .confirm .no:hover { border-color: #d8b56a; color: #fff; }
  .ico svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  h1 { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #9a8c70; margin: 8px 0 4px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 6px; padding: 3px 6px; margin: 2px 0; border-left: 2px solid #d8b56a; background: rgba(216, 181, 106, 0.08); cursor: pointer; }
  li:hover { background: rgba(216, 181, 106, 0.22); }
  li .gem-name { flex: 1; }
  li .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; border: 1px solid rgba(0, 0, 0, 0.5); }
  li .dot.str { background: #d4553f; }
  li .dot.dex { background: #74b84f; }
  li .dot.int { background: #5f92e6; }
  li .dot.white { background: #dcdcdc; }
  li .dot.unknown { border-color: #9a8c70; }
  li .wiki { font-size: 11px; color: #9a8c70; text-decoration: underline; }
  li .wiki:hover { color: #fff; }
  .none { color: #9a8c70; }
  .merc { margin-top: 8px; padding: 6px 8px; border-left: 3px solid #9a8c70; background: rgba(255, 255, 255, 0.05); }
  .merc.good, .merc.great, .merc.check { border-color: #74b84f; background: rgba(116, 184, 79, 0.16); }
  .merc.great { border-left-width: 6px; background: rgba(116, 184, 79, 0.28); }
  .merc.ok { border-color: #d8b56a; background: rgba(216, 181, 106, 0.14); }
  .merc.partial { border-color: #d8b56a; }
  .merc.unlisted, .merc.none { border-color: #9a8c70; }
  .merc-verdict { font-size: 11px; font-weight: 600; letter-spacing: .06em; color: #9a8c70; }
  .merc.good .merc-verdict, .merc.great .merc-verdict, .merc.check .merc-verdict { color: #9ed67c; }
  .merc.ok .merc-verdict { color: #d8b56a; }
  .merc.partial .merc-verdict { color: #d8b56a; }
  .merc-title { font-weight: 600; font-size: 14px; }
  .merc-line { font-size: 11px; color: #c9c0a8; margin-top: 2px; }
  .passive-step { font-size: 11px; color: #9a8c70; white-space: nowrap; }
  .passive-undo { font-size: 11px; color: #9a8c70; text-decoration: underline; cursor: pointer; margin-top: 3px; display: inline-block; }
  .passive-undo:hover { color: #fff; }
  .status { margin-top: 8px; font-size: 11px; color: #9a8c70; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="panel" id="panel">
  <div class="bar" id="bar" title="Drag to move the overlay">
    <span class="grip" aria-hidden="true"><svg viewBox="0 0 8 12"><circle cx="2" cy="2" r="1"/><circle cx="6" cy="2" r="1"/><circle cx="2" cy="6" r="1"/><circle cx="6" cy="6" r="1"/><circle cx="2" cy="10" r="1"/><circle cx="6" cy="10" r="1"/></svg></span>
    <button class="ico" id="config" title="Gem route: choose the gems for each area" aria-label="Gem route">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 2.5h6l3 4-6 7.5-6-7.5z"/><path d="M2 6.5h12M5 2.5l1 4 2 7.5 2-7.5 1-4"/></svg>
    </button>
    <button class="ico" id="tree" title="Passive tree: import a build and order its points" aria-label="Passive tree">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 4.5 6h2L3.5 10.5h9L9.500 6h2z"/><path d="M8 10.500v4"/></svg>
    </button>
    <button class="ico" id="notes" title="Notes of the imported build" aria-label="Build notes" hidden>
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.500h6l3 3v10h-9z"/><path d="M9.500 1.500v3h3M5.500 8h5M5.500 11h5"/></svg>
    </button>
    <button class="ico" id="library" title="Builds: save this setup or load another one" aria-label="Builds">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 2.5h3v11h-3zM5.5 2.5h3v11h-3z"/><path d="M9.300 4.200l2.800-.9 2.400 9.600-2.800.9z"/></svg>
    </button>
    <span class="gap"></span>
    <button class="ico" id="more" title="More: options, size and reset" aria-label="More" aria-expanded="false" aria-controls="menu">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.500" cy="8" r=".9"/><circle cx="8" cy="8" r=".9"/><circle cx="12.500" cy="8" r=".9"/></svg>
    </button>
    <button class="ico" id="quit" title="Close the overlay" aria-label="Close the overlay">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </div>
  <div class="menu" id="menu" hidden>
    <button class="item" id="options"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 3.3L6.8 1.5L9.2 1.5L9.5 3.3L10.2 3.6L11.7 2.5L13.5 4.3L12.4 5.8L12.7 6.5L14.5 6.8L14.5 9.2L12.7 9.5L12.4 10.2L13.5 11.7L11.7 13.5L10.2 12.4L9.5 12.7L9.2 14.5L6.8 14.5L6.5 12.7L5.8 12.4L4.3 13.5L2.5 11.7L3.6 10.2L3.3 9.5L1.5 9.2L1.5 6.8L3.3 6.5L3.6 5.8L2.5 4.3L4.3 2.5L5.8 3.6z"/><circle cx="8" cy="8" r="2"/></svg><span>Options</span></button>
    <div class="item size">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.5 2.5h4v4M13.5 2.5 9 7M6.5 13.5h-4v-4M2.5 13.5 7 9"/></svg>
      <span>Window Size</span>
      <button class="ico" id="smaller" title="Make the overlay smaller" aria-label="Make the overlay smaller"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8h8"/></svg></button>
      <button class="ico" id="bigger" title="Make the overlay bigger" aria-label="Make the overlay bigger"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8h8M8 4v8"/></svg></button>
    </div>
    <label class="item volume" title="Volume of the overlay sounds">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6.2h2.300l3.200-2.700v9l-3.200-2.700h-2.300z"/><path class="waves" d="M10.300 5.800a3.200 3.200 0 0 1 0 4.400M12 4a5.700 5.700 0 0 1 0 8"/><path class="muted" d="M10.500 6.200l3.200 3.600M13.700 6.200l-3.200 3.600"/></svg>
      <span>Volume</span>
      <input type="range" id="volume" min="0" max="100" step="5" value="80" aria-label="Volume of the overlay sounds">
      <output id="volume-value" for="volume">80</output>
    </label>
    <button class="item danger" id="reset" title="Asks before doing it"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.600-3.700"/><path d="M13 2v3h-3"/></svg><span>Reset progress</span></button>
  </div>
  <div class="confirm" id="confirm-reset" hidden>
    <strong>Reset your progress?</strong>
    <p>This forgets the areas you have visited, the gems marked as bought and the passive points marked as taken.</p>
    <p class="keep">Your gem route, the order of the passive tree and the build notes are kept.</p>
    <div class="actions">
      <button class="yes" id="reset-yes">Reset</button>
      <button class="no" id="reset-no">Cancel</button>
    </div>
  </div>
  <div class="head">
    <span class="area" id="area">...</span>
    <span class="act" id="act" hidden></span>
  </div>
  <div id="list"></div>
  <div id="passive"></div>
  <div id="merc"></div>
  <div class="status" id="status"></div>
</div>
<script src="js/overlay.js"></script>
</body>
</html>
